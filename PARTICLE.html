
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixelated Minecraft Explosion</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87a0d8;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      background: linear-gradient(#7e90c8, #9fb5e8);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener("resize", resize);

    const particles = [];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function choice(arr) {
      return arr[(Math.random() * arr.length) | 0];
    }

    class ExplosionParticle {
      constructor(x, y) {
        const angle = Math.random() * Math.PI * 2;
        const speed = rand(1.5, 7.5);

        this.x = x + rand(-8, 8);
        this.y = y + rand(-8, 8);

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - rand(0, 1.2);

        this.size = rand(10, 34);
        this.growth = rand(0.15, 0.45);

        this.life = 1;
        this.decay = rand(0.012, 0.026);

        this.rotation = rand(0, Math.PI * 2);
        this.spin = rand(-0.04, 0.04);

        this.color = choice([
          "rgba(255,255,255,1)",
          "rgba(245,245,245,1)",
          "rgba(230,230,230,1)",
          "rgba(210,210,210,1)",
          "rgba(185,185,185,1)"
        ]);

        // 0 = ring, 1 = broken ring, 2 = blob
        this.type = Math.floor(rand(0, 3));

        this.thickness = rand(0.18, 0.38);
        this.arcStart = rand(0, Math.PI * 2);
        this.arcLength = rand(Math.PI * 1.1, Math.PI * 1.9);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.975;
        this.vy *= 0.975;

        this.size += this.growth;
        this.rotation += this.spin;
        this.life -= this.decay;
      }

      draw(ctx) {
        if (this.life <= 0) return;

        ctx.save();

        const pxSnap = 2;
        const drawX = Math.round(this.x / pxSnap) * pxSnap;
        const drawY = Math.round(this.y / pxSnap) * pxSnap;

        ctx.translate(drawX, drawY);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life * 0.95;

        if (this.type === 0) {
          drawPixelRing(ctx, this.size, this.thickness, this.color);
        } else if (this.type === 1) {
          drawPixelBrokenRing(
            ctx,
            this.size,
            this.thickness,
            this.color,
            this.arcStart,
            this.arcLength
          );
        } else {
          drawPixelBlob(ctx, this.size, this.color);
        }

        ctx.restore();
      }
    }

    function drawPixelRing(ctx, size, thickness, color) {
      const px = 4;
      const outer = size;
      const inner = size * (1 - thickness);

      ctx.fillStyle = color;

      for (let x = -outer; x <= outer; x += px) {
        for (let y = -outer; y <= outer; y += px) {
          const d = Math.sqrt(x * x + y * y);

          if (d <= outer && d >= inner) {
            ctx.fillRect(
              Math.round(x / px) * px,
              Math.round(y / px) * px,
              px,
              px
            );
          }
        }
      }
    }

    function drawPixelBrokenRing(ctx, size, thickness, color, start, length) {
      const px = 4;
      const outer = size;
      const inner = size * (1 - thickness);

      ctx.fillStyle = color;

      for (let x = -outer; x <= outer; x += px) {
        for (let y = -outer; y <= outer; y += px) {
          const d = Math.sqrt(x * x + y * y);
          let angle = Math.atan2(y, x);

          if (angle < 0) angle += Math.PI * 2;

          let rel = angle - start;
          if (rel < 0) rel += Math.PI * 2;

          if (d <= outer && d >= inner && rel <= length) {
            ctx.fillRect(
              Math.round(x / px) * px,
              Math.round(y / px) * px,
              px,
              px
            );
          }
        }
      }
    }

    function drawPixelBlob(ctx, size, color) {
      const px = 4;
      const radius = size * 0.7;

      ctx.fillStyle = color;

      for (let x = -radius; x <= radius; x += px) {
        for (let y = -radius; y <= radius; y += px) {
          const d = Math.sqrt(x * x + y * y);

          if (d < radius + Math.random() * px * 1.5) {
            ctx.fillRect(
              Math.round(x / px) * px,
              Math.round(y / px) * px,
              px,
              px
            );
          }
        }
      }
    }

    function explode(x, y, amount = 120) {
      for (let i = 0; i < amount; i++) {
        particles.push(new ExplosionParticle(x, y));
      }
    }

    function update() {
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();

        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of particles) {
        p.draw(ctx);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();

    canvas.addEventListener("click", (e) => {
      explode(e.clientX, e.clientY, 140);
      setTimeout(() => explode(e.clientX, e.clientY, 80), 50);
    });
  </script>
</body>
</html>
